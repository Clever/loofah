version: 2.1

orbs:
  clever: clever/circleci-orbs@0

jobs:
  unit-test:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Set up .npmrc
          command: |
            sed -i.bak s/\${npm_auth_token}/$NPM_TOKEN/ .npmrc_docker
            mv .npmrc_docker .npmrc
      - run: npm install
      - run: make build
      # - run: make lint
      - run: make test

workflows:
  build_test_publish:
    jobs:
      - unit-test:
          context:
            - npm-publishing
      - clever/module_publish:
          go_module: false
          node_module: true
          node_module_path: .
          before_release:
            - run:
                name: Set up .npmrc
                command: |
                  sed -i.bak s/\${npm_auth_token}/$NPM_TOKEN/ .npmrc_docker
                  mv .npmrc_docker .npmrc
            - run: npm install
            - run: make build
          filters:
            branches:
              only: master
          requires:
            - unit-test
          context:
            - github-app-auth
            - npm-publishing
      - clever/publish_utility:
          filters:
            branches:
              only: master
          requires:
            - unit-test
          context:
            - github-app-auth
            - catalog
